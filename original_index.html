<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabCanvas Pro | Creative Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.2);
            --bg-dark: #020617;
            --surface: rgba(15, 23, 42, 0.8);
            --surface-hover: rgba(30, 41, 59, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-muted: #64748b;
            --accent-cyan: #22d3ee;
            --radius-xl: 20px;
            --radius-lg: 12px;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- Auth Overlay --- */
        #auth-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #auth-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .auth-card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 48px; border-radius: 32px; width: 440px; text-align: center;
            box-shadow: var(--shadow); animation: fadeIn 0.8s ease-out;
        }
        .auth-card h1 { font-size: 38px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.03em; background: linear-gradient(to bottom right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-card p { color: var(--text-muted); margin-bottom: 32px; line-height: 1.6; }

        .btn-primary {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 14px; border-radius: var(--radius-lg); font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }

        .input-pro {
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            padding: 14px 18px; border-radius: var(--radius-lg); color: white; margin-bottom: 12px;
            outline: none; transition: all 0.2s; font-family: inherit;
        }
        .input-pro:focus { border-color: var(--primary); background: rgba(0,0,0,0.3); }

        /* --- Main App UI --- */
        #app-container { flex: 1; position: relative; display: flex; flex-direction: column; }

        /* Toolbar */
        .toolbar {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
            background: var(--surface); backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 8px 12px; display: flex; gap: 6px; align-items: center;
            z-index: 100; box-shadow: var(--shadow);
        }

        .tool-group { display: flex; gap: 4px; padding: 0 8px; border-right: 1px solid var(--border); }
        .tool-group:last-child { border-right: none; }

        .btn-tool {
            width: 44px; height: 44px; border: none; background: transparent;
            color: var(--text-muted); cursor: pointer; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); font-size: 20px;
        }
        .btn-tool:hover { background: var(--surface-hover); color: var(--text); }
        .btn-tool.active { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }

        /* Color Picker Overlay */
        .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
        .color-dot.active { border-color: white; transform: scale(1.2); }

        /* Canvas Wrapper */
        .viewport {
            flex: 1; background: #0f172a; overflow: hidden;
            display: flex; align-items: center; justify-content: center; position: relative;
        }

        #canvas-board {
            background: white; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            cursor: crosshair;
        }

        #canvas-workspace {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #canvas-workspace > * {
            pointer-events: auto;
        }

        /* Blueprint Mode */
        .blueprint #canvas-board { background: #0c111d; }
        .blueprint .viewport { background: #020617; }

        /* Overlay UI */
        .side-panel {
            position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
            background: var(--surface); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 90;
        }

        .status-bar {
            position: absolute; bottom: 24px; left: 24px; right: 24px;
            display: flex; justify-content: space-between; align-items: center; pointer-events: none;
        }
        .pill {
            background: var(--surface); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 500;
            color: var(--text-muted); backdrop-filter: blur(12px); pointer-events: auto;
            display: flex; align-items: center; gap: 8px;
        }
        .pulse { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 12px #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Engineering Grid Overlay */
        #grid-overlay {
            position: absolute; inset: 0; pointer-events: none; opacity: 0.1;
            background-size: 40px 40px;
        }
        .grid-dots { background-image: radial-gradient(circle, #fff 1px, transparent 1px); }
        .grid-lines { background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); }

    </style>
</head>
<body class="blueprint">

    <!-- Auth System -->
    <div id="auth-overlay">
        <div class="auth-card">
            <div style="font-size: 48px; margin-bottom: 20px;">🎨</div>
            <h1>CollabCanvas Pro</h1>
            <p>The elite workspace for technical teams and creative minds.</p>

            <div id="auth-step-1" class="step">
                <div id="g_id_onload"
                     data-client_id="222718818435-k0is9elsnfejlblr43p44bt3i3fltk6f.apps.googleusercontent.com"
                     data-callback="handleAuth"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-width="340"></div>
                
                <div style="margin: 20px 0; font-size: 13px; color: var(--text-muted);">— OR —</div>
                <button class="btn-primary" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border);" onclick="guestLogin()">Continue as Guest</button>
            </div>

            <div id="auth-step-2" class="step" style="display: none;">
                <button class="btn-primary" onclick="createSession()">New Technical Canvas</button>
                <div style="margin: 16px 0; font-size: 13px; color: var(--text-muted);">OR JOIN SESSION</div>
                <input type="text" id="join-id" class="input-pro" placeholder="Enter Workspace ID">
                <button class="btn-primary" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border);" onclick="joinSession()">Join Workspace</button>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="app-container">
        <!-- Floating Main Toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <button class="btn-tool active" onclick="setTool('pen', this)" title="Brush (P)">🖌️</button>
                <button class="btn-tool" onclick="setTool('highlighter', this)" title="Highlighter (H)">🖍️</button>
                <button class="btn-tool" onclick="setTool('laser', this)" title="Laser Pointer (L)">🔦</button>
                <button class="btn-tool" onclick="setTool('eraser', this)" title="Eraser (E)">🧹</button>
            </div>
            <div class="tool-group">
                <button class="btn-tool" onclick="setTool('line', this)" title="Line (L)">📏</button>
                <button class="btn-tool" onclick="setTool('rect', this)" title="Rectangle (R)">▯</button>
                <button class="btn-tool" onclick="setTool('circle', this)" title="Circle (C)">◯</button>
                <button class="btn-tool" onclick="setTool('arrow', this)" title="Arrow (A)">↗</button>
            </div>
            <div class="tool-group">
                <button class="btn-tool" onclick="setTool('sticky', this)" title="Sticky Note (N)">📝</button>
                <button class="btn-tool" onclick="setTool('text', this)" title="Text (T)">T</button>
            </div>
            <div class="tool-group" style="padding-left: 12px; gap: 8px;">
                <div class="color-dot active" style="background: #6366f1;" onclick="setColor('#6366f1', this)"></div>
                <div class="color-dot" style="background: #22d3ee;" onclick="setColor('#22d3ee', this)"></div>
                <div class="color-dot" style="background: #f43f5e;" onclick="setColor('#f43f5e', this)"></div>
                <div class="color-dot" style="background: #10b981;" onclick="setColor('#10b981', this)"></div>
                <div class="color-dot" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
            </div>
        </div>

        <!-- Secondary Side Panel -->
        <div class="side-panel">
            <button class="btn-tool" onclick="toggleBlueprint()" title="Toggle Blueprint Mode">🌙</button>
            <button class="btn-tool" onclick="cycleGrid()" title="Change Grid Type">▦</button>
            <div style="height: 1px; background: var(--border); margin: 4px 0;"></div>
            <button class="btn-tool" onclick="undo()" title="Undo (Ctrl+Z)">↩️</button>
            <button class="btn-tool" onclick="clearBoard()" title="Clear Board">🗑️</button>
            <button class="btn-tool" onclick="exportImage()" title="Export PNG">💾</button>
        </div>

        <!-- Infinite Viewport -->
        <div class="viewport" id="viewport">
            <div id="grid-overlay" class="grid-dots"></div>
            <div id="canvas-workspace">
                <canvas id="canvas-board"></canvas>
                <canvas id="preview-board" style="position: absolute; inset: 0; pointer-events: none;"></canvas>
                <canvas id="laser-board" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.8;"></canvas>
                <div id="sticky-container" style="position: absolute; inset: 0; pointer-events: none;"></div>
            </div>
        </div>

        <!-- Real-time Status -->
        <div class="status-bar">
            <div class="pill">
                <div class="pulse"></div>
                <span id="conn-text">Connecting...</span>
            </div>
            <div class="pill" id="session-pill" style="cursor: pointer;" onclick="copyID()">
                <span id="session-id-text">No Session</span>
                <span style="font-size: 10px; opacity: 0.5;">COPY ID</span>
            </div>
        </div>
    </div>

    <script>
        const board = document.getElementById('canvas-board');
        const ctx = board.getContext('2d');
        const preview = document.getElementById('preview-board');
        const pctx = preview.getContext('2d');
        const laserBoard = document.getElementById('laser-board');
        const lctx = laserBoard.getContext('2d');
        const overlay = document.getElementById('auth-overlay');

        let isDrawing = false;
        let tool = 'pen';
        let color = '#6366f1';
        let startX, startY;
        let lastX, lastY;
        let history = [];
        let token = null;
        let sid = null;
        let laserPoints = [];

        let ws, pc, dc;

        function init() {
            const w = 2400, h = 1600;
            [board, preview, laserBoard].forEach(c => { c.width = w; c.height = h; });
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            pctx.lineCap = 'round'; pctx.lineJoin = 'round';
            lctx.lineCap = 'round'; lctx.lineJoin = 'round';
            
            const workspace = document.getElementById('canvas-workspace');
            workspace.style.width = w + 'px';
            workspace.style.height = h + 'px';
            
            const ratio = Math.min(window.innerWidth / w, window.innerHeight / h) * 0.95;
            workspace.dataset.scale = ratio;
            workspace.style.transform = `translate(-50%, -50%) scale(${ratio})`;
        }
        init();
        window.addEventListener('resize', init);

        // --- AUTH & SESSIONS ---
        async function handleAuth(res) {
            const out = await fetch('/api/auth/google', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ credential: res.credential })
            });
            const data = await out.json();
            token = data.access_token;
            showSessionStep();
        }

        function guestLogin() {
            token = 'GUEST_TOKEN'; // Minimal bypass for UI demo/guest use
            showSessionStep();
        }

        function showSessionStep() {
            document.getElementById('auth-step-1').style.display = 'none';
            document.getElementById('auth-step-2').style.display = 'block';
        }

        async function createSession() {
            const res = await fetch('/api/sessions', { headers: {'Authorization': `Bearer ${token}`}, method: 'POST' });
            const data = await res.json();
            launch(data.session_id);
        }

        async function joinSession() {
            const id = document.getElementById('join-id').value.toUpperCase();
            if(!id) return;
            try {
                const res = await fetch(`/api/sessions/${id}`, { headers: {'Authorization': `Bearer ${token}`} });
                if(res.ok) {
                    const data = await res.json();
                    renderHistory(data.canvas_state);
                    launch(data.session_id);
                } else {
                    alert("Workspace not found or access denied.");
                }
            } catch (e) {
                alert("Connection failed. Is the server running?");
            }
        }

        function launch(id) {
            sid = id;
            overlay.classList.add('hidden');
            document.getElementById('session-id-text').textContent = `WORKSPACE: ${id}`;
            setupRTC(id);
        }

        // --- RTC ---
        function setupRTC(id) {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws/${id}`);
            pc = new RTCPeerConnection({ iceServers: [{urls: 'stun:stun.l.google.com:19302'}] });

            ws.onmessage = async (e) => {
                const m = JSON.parse(e.data);
                if(m.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(m));
                    const a = await pc.createAnswer();
                    await pc.setLocalDescription(a);
                    ws.send(JSON.stringify(pc.localDescription));
                } else if(m.type === 'answer') { await pc.setRemoteDescription(new RTCSessionDescription(m)); }
                else if(m.type === 'candidate') { await pc.addIceCandidate(new RTCIceCandidate(m.candidate)); }
                else if(m.type === 'request_offer') { createOffer(); }
            };

            pc.onicecandidate = (e) => { if(e.candidate) ws.send(JSON.stringify({type:'candidate', candidate: e.candidate})); };
            dc = pc.createDataChannel('draw');
            bindDC(dc);
            pc.ondatachannel = (e) => bindDC(e.channel);
            ws.onopen = () => ws.send(JSON.stringify({type:'request_offer'}));
        }

        function createOffer() { pc.createOffer().then(o => { pc.setLocalDescription(o); ws.send(JSON.stringify(o)); }); }

        function bindDC(c) {
            dc = c;
            c.onopen = () => {
                document.getElementById('conn-text').textContent = 'Live Workspace Connected';
                document.getElementById('conn-text').style.color = '#22c55e';
            };
            c.onmessage = (e) => { const cmd = JSON.parse(e.data); exec(cmd); history.push(cmd); };
        }

        // --- DRAWING ENGINE ---
        function getPos(e) {
            const r = board.getBoundingClientRect();
            const workspace = document.getElementById('canvas-workspace');
            const s = parseFloat(workspace.dataset.scale);
            return {
                x: (e.clientX - r.left) / s,
                y: (e.clientY - r.top) / s
            };
        }

        board.addEventListener('mousedown', e => {
            isDrawing = true;
            const {x,y} = getPos(e);
            startX = x; startY = y;
            lastX = x; lastY = y;
        });

        board.addEventListener('mousemove', e => {
            const {x,y} = getPos(e);
            
            if (tool === 'laser') {
                laserPoints.push({x, y, time: Date.now()});
                broadcast({t:'laser', x, y});
                return;
            }

            if(!isDrawing) return;
            
            if(['pen', 'eraser', 'highlighter'].includes(tool)) {
                const cmd = {
                    t: 'path', x1: lastX, y1: lastY, x2: x, y2: y,
                    c: tool === 'eraser' ? (document.body.classList.contains('blueprint') ? '#0c111d' : '#ffffff') : color,
                    w: tool === 'eraser' ? 40 : (tool === 'highlighter' ? 30 : 4),
                    o: tool === 'highlighter' ? 0.3 : 1
                };
                exec(cmd);
                broadcast(cmd);
                lastX = x; lastY = y;
            } else if (tool !== 'sticky') {
                pctx.clearRect(0, 0, board.width, board.height);
                drawShape(pctx, startX, startY, x, y, tool, color);
            }
        });

        board.addEventListener('mouseup', e => {
            if(!isDrawing) return;
            isDrawing = false;
            const {x,y} = getPos(e);
            if(tool === 'sticky') {
                createSticky(x, y);
                broadcast({t:'sticky', x, y});
            } else if(!['pen', 'eraser', 'highlighter', 'laser'].includes(tool)) {
                pctx.clearRect(0, 0, board.width, board.height);
                const cmd = { t: 'shape', s: tool, x1: startX, y1: startY, x2: x, y2: y, c: color, w: 4 };
                exec(cmd);
                broadcast(cmd);
            }
        });

        // Laser trail loop
        function updateLaser() {
            lctx.clearRect(0, 0, laserBoard.width, laserBoard.height);
            const now = Date.now();
            laserPoints = laserPoints.filter(p => now - p.time < 1000);
            
            if (laserPoints.length > 1) {
                lctx.beginPath();
                lctx.strokeStyle = '#f43f5e';
                lctx.lineWidth = 4;
                lctx.moveTo(laserPoints[0].x, laserPoints[0].y);
                for (let i = 1; i < laserPoints.length; i++) {
                    const p = laserPoints[i];
                    lctx.globalAlpha = 1 - (now - p.time) / 1000;
                    lctx.lineTo(p.x, p.y);
                }
                lctx.stroke();
            }
            requestAnimationFrame(updateLaser);
        }
        updateLaser();

        function createSticky(x, y, text = "New Note") {
            const s = document.createElement('div');
            s.style.cssText = `position:absolute; left:${x}px; top:${y}px; width:150px; min-height:150px; background:#fef08a; color:#854d0e; padding:10px; border-radius:8px; pointer-events:auto; box-shadow:0 10px 20px rgba(0,0,0,0.2); font-size:14px; transform:translate(-50%, -50%) rotate(-2deg);`;
            s.contentEditable = true;
            s.innerText = text;
            document.getElementById('sticky-container').appendChild(s);
        }

        function exec(cmd) {
            if(cmd.t === 'path') {
                ctx.globalAlpha = cmd.o || 1;
                ctx.beginPath(); ctx.strokeStyle = cmd.c; ctx.lineWidth = cmd.w;
                ctx.moveTo(cmd.x1, cmd.y1); ctx.lineTo(cmd.x2, cmd.y2); ctx.stroke();
                ctx.globalAlpha = 1;
            } else if(cmd.t === 'shape') {
                drawShape(ctx, cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.s, cmd.c, cmd.w);
            }
        }

        function broadcast(cmd) {
            history.push(cmd);
            if(dc && dc.readyState === 'open') dc.send(JSON.stringify(cmd));
        }

        function drawShape(t, x1, y1, x2, y2, s, c, w) {
            t.beginPath(); t.strokeStyle = c; t.lineWidth = w;
            if(s === 'line') { t.moveTo(x1, y1); t.lineTo(x2, y2); }
            else if(s === 'rect') { t.rect(x1, y1, x2-x1, y2-y1); }
            else if(s === 'circle') { const r = Math.hypot(x2-x1, y2-y1); t.arc(x1, y1, r, 0, 7); }
            else if(s === 'arrow') {
                const l = 20, a = Math.atan2(y2-y1, x2-x1);
                t.moveTo(x1, y1); t.lineTo(x2, y2);
                t.lineTo(x2 - l*Math.cos(a-0.5), y2 - l*Math.sin(a-0.5));
                t.moveTo(x2, y2); t.lineTo(x2 - l*Math.cos(a+0.5), y2 - l*Math.sin(a+0.5));
            }
            t.stroke();
        }

        // --- UI ACTIONS ---
        function setTool(t, el) {
            tool = t;
            document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function setColor(c, el) {
            color = c;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleBlueprint() { document.body.classList.toggle('blueprint'); }

        let grid = 'dots';
        function cycleGrid() {
            const g = document.getElementById('grid-overlay');
            if(grid === 'dots') { g.className = 'grid-lines'; grid = 'lines'; }
            else if(grid === 'lines') { g.className = ''; grid = 'none'; }
            else { g.className = 'grid-dots'; grid = 'dots'; }
        }

        function clearBoard() { ctx.clearRect(0, 0, board.width, board.height); history = []; }
        
        async function exportImage() {
            const link = document.createElement('a');
            link.download = `collab-export-${Date.now()}.png`;
            link.href = board.toDataURL();
            link.click();
        }

        function renderHistory(cmds) { cmds.forEach(exec); history = cmds; }
        function copyID() { navigator.clipboard.writeText(sid); alert('Workspace ID Copied!'); }

    </script>
</body>
</html>
